<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Super-eroul Autocontrolului – Aventurile Împăcării</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* previne selectarea textului pe butoane, dar不影响 citire */
        }

        body {
            background: linear-gradient(145deg, #1b98e0 0%, #6f4c9e 100%);
            font-family: 'Comic Neue', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', 'Apple Color Emoji', cursive, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        /* container joc principal */
        .game-container {
            max-width: 1100px;
            width: 100%;
            background: #fff9e8;
            border-radius: 72px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
            transition: all 0.2s ease;
            border: 4px solid #ffd966;
        }

        /* header punctaj + titlu dinamic */
        .game-header {
            background: #ffb347;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 5px solid #ff8c1a;
        }

        .score-box {
            background: #2e2c2a;
            padding: 8px 20px;
            border-radius: 60px;
            color: #ffec5e;
            font-weight: bold;
            font-size: 1.7rem;
            box-shadow: inset 0 -2px 0 #4a3e35, 0 6px 12px rgba(0,0,0,0.1);
        }

        .score-box span {
            font-size: 2rem;
            color: #f9d56e;
        }

        .status-area {
            background: #fdf8e7;
            padding: 10px 25px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #c24d0e;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* zona de continut principal */
        .game-main {
            padding: 30px 35px;
        }

        /* ecran start */
        .start-screen {
            text-align: center;
            padding: 25px 15px;
        }

        .super-title {
            font-size: 3rem;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            display: inline-block;
            padding: 15px 30px;
            border-radius: 80px;
            box-shadow: 0 12px 0 #bb7a2e;
            color: #2f2e2e;
            margin-bottom: 20px;
        }

        .hero-img {
            font-size: 7rem;
            margin: 15px 0;
        }

        .btn-start {
            background: #4caf50;
            border: none;
            font-size: 2rem;
            font-weight: bold;
            padding: 18px 45px;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 0 #1f5f2a;
            font-family: inherit;
            margin-top: 20px;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #1f5f2a;
        }

        /* zona de intrebare */
        .question-area {
            background: #fff2d7;
            border-radius: 68px;
            padding: 20px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .situation-text {
            font-size: 1.8rem;
            background: #fceeca;
            padding: 20px;
            border-radius: 60px;
            text-align: center;
            margin-bottom: 35px;
            border: 3px dashed #ffaa33;
            font-weight: bold;
            color: #3b2c1f;
        }

        .reaction-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 15px;
        }

        .reaction-btn {
            flex: 1;
            min-width: 180px;
            background: #ffe0a3;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 16px 12px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            box-shadow: 0 5px 0 #ad8b4c;
            color: #3b2a1c;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .reaction-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #ad8b4c;
        }

        .reaction-btn.incorrect-tap {
            background-color: #ffaaaa;
            transform: scale(0.98);
        }

        .mesaj-feedback {
            background: #dfeef8;
            border-radius: 40px;
            padding: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 20px;
            border-left: 18px solid #ffb347;
        }

        /* provocare numaratoare */
        .challenge-area {
            background: #c8e7f5;
            border-radius: 56px;
            margin-top: 35px;
            padding: 20px;
            text-align: center;
            border: 3px solid #f7b05e;
        }

        .challenge-title {
            font-size: 1.6rem;
            font-weight: bold;
            background: #ffd966;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
        }

        .count-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .count-number {
            font-size: 3.5rem;
            background: white;
            width: 100px;
            text-align: center;
            padding: 15px 0;
            border-radius: 70px;
            font-weight: bold;
            box-shadow: inset 0 0 0 3px #ffaa55, 0 8px 0 #bc8f4a;
        }

        .btn-count {
            background: #ff7b2c;
            border: none;
            font-size: 1.5rem;
            padding: 12px 28px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #a33f00;
        }

        .btn-count:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #a33f00;
        }

        /* buton final / next */
        .next-area {
            text-align: center;
            margin-top: 25px;
        }

        .btn-next {
            background: #3a86ff;
            color: white;
            border: none;
            font-size: 1.4rem;
            padding: 12px 35px;
            border-radius: 48px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 5px 0 #1e4f9e;
        }

        .finish-message {
            font-size: 2rem;
            text-align: center;
            background: gold;
            padding: 20px;
            border-radius: 60px;
        }

        button {
            transition: all 0.05s linear;
        }

        @media (max-width: 680px) {
            .game-main {
                padding: 20px;
            }
            .situation-text {
                font-size: 1.3rem;
            }
            .reaction-btn {
                font-size: 0.9rem;
                min-width: 130px;
            }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <!-- Structura dinamica generata de JS -->
</div>

<script>
    // --------------------- DATELE JOCULUI (8 situatii scolare) ---------------------------------
    // Fiecare situatie contine text + variantele originale (impulsiv, evitare, supererou)
    // Stocam textul si continutul fiecarui tip.
    const SITUATII_ORIGINALE = [
        {
            text: "😤 La ora de sport, un coleg te împinge de la spate și râde. Tu ce faci?",
            corect: "supererou",
            variante: {
                impulsiv: "🤜 Îl împing și eu mai tare! (reacție impulsivă)",
                evitare: "🙈 Plec supărat și nu mai vorbesc cu nimeni. (reacție de evitare)",
                supererou: "🦸‍♂️ Respir adânc, îi spun calm: 'Te rog, nu mai împinge, hai să jucăm frumos!' (reacție de super-erou)"
            }
        },
        {
            text: "🗣️ Cineva din clasă râde de tine pentru că ai greșit un exercițiu. Ce alegi?",
            corect: "supererou",
            variante: {
                impulsiv: "🔥 Țip la el și îi spun că e prost. (impulsiv)",
                evitare: "😥 Plâng și nu mai particip la ore. (evitare)",
                supererou: "🧘 Zâmbesc și spun: 'Toți greșim, dar eu învăț din greșeli!' (super autocontrol)"
            }
        },
        {
            text: "⚽ Doi copii vor aceeași minge la pauză și încep să se certe. Tu ce faci?",
            corect: "supererou",
            variante: {
                impulsiv: "🥊 Mă bag și eu în ceartă și smulg mingea.",
                evitare: "🏃‍♂️ Plec departe, nu mă interesează. (evitare)",
                supererou: "🤝 Vin calm, sugerez: 'Hai să numărăm până la 10 și apoi fiecare joacă 5 minute!' (soluție pașnică)"
            }
        },
        {
            text: "✏️ Colegul tău îți ia creionul preferat fără să ceară. Cum reacționezi?",
            corect: "supererou",
            variante: {
                impulsiv: "😠 I-l smuc repede și îl înjur. (impulsiv)",
                evitare: "😞 Tac, dar mă simt nedreptățit și nu mai spun nimic. (evitare)",
                supererou: "🗣️ 'Îmi pare rău, dar acesta e creionul meu. Te rog să mi-l dai înapoi și poți să ți-l împrumut pe al meu după ce termin.'"
            }
        },
        {
            text: "📢 La ora de grup, un coleg spune că ideea ta e proastă. Ce faci?",
            corect: "supererou",
            variante: {
                impulsiv: "😤 Îi răspund și eu urât, îl fac prost.",
                evitare: "🙁 Nu mai zic nimic, renunț la ideea mea.",
                supererou: "🧠 'Mulțumesc pentru părere, dar hai să analizăm ideea împreună, poate găsim ceva bun la ea.'"
            }
        },
        {
            text: "🍎 La coadă la masă, un copil te taie în față. Tu ce faci?",
            corect: "supererou",
            variante: {
                impulsiv: "👊 Îl împing la coadă înapoi cu forța.",
                evitare: "😔 Plec încet și nu mai iau deloc mâncarea.",
                supererou: "🦸‍♀️ 'Scuze, cred că nu ai văzut, dar eu eram în față. Te rog să respecți rândul, mulțumesc!'"
            }
        },
        {
            text: "🚸 Prietenul tău spune o minciună despre tine la grup. Ce alegi?",
            corect: "supererou",
            variante: {
                impulsiv: "💢 Îi spun minciuni și mai urâte la toată lumea.",
                evitare: "🙅 Mă îndepărtez și rup prietenia fără să vorbim.",
                supererou: "💬 Stau de vorbă privat: 'Mă doare ce ai spus, hai să clarificăm împreună ce s-a întâmplat, ești prietenul meu.'"
            }
        },
        {
            text: "🎨 La desen, cineva îți strică lucrarea din greșeală. Reacția ta?",
            corect: "supererou",
            variante: {
                impulsiv: "😡 Îi stric și lui lucrarea intenționat.",
                evitare: "😭 Arunc totul și plec acasă nervos.",
                supererou: "🕊️ 'Știu că n-ai vrut. Hai să vedem cum putem repara sau să desenăm ceva și mai frumos împreună!'"
            }
        }
    ];

    // Pentru fiecare situatie, vom genera o lista amestecata de obiecte { type, text }
    // Aceasta functie pregateste datele pentru situatia curenta, amestecand aleator ordinea.
    function getShuffledOptionsForSituation(situation) {
        const options = [
            { type: "impulsiv", text: situation.variante.impulsiv },
            { type: "evitare", text: situation.variante.evitare },
            { type: "supererou", text: situation.variante.supererou }
        ];
        // Fisher-Yates shuffle pentru amestecare
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        return options;
    }

    // variabile joc
    let currentIndex = 0;          // situatia curenta (0-7)
    let score = 0;
    let gameActive = false;         // daca jocul a inceput (nu mai e start)
    let waitingForNext = false;     // dupa raspuns, asteapta next
    let currentShuffledOptions = []; // stocheaza optiunile amestecate pentru situatia curenta
    let currentCorrectType = "supererou"; // tipul corect (mereu supererou)

    // Helper: render complet (folosit la fiecare schimbare)
    const root = document.getElementById("gameRoot");

    // functia principala de re-rendare
    function render() {
        if (!gameActive) {
            // ECRAN START
            root.innerHTML = `
                <div class="game-header">
                    <div class="score-box">⭐ Punctaj: <span>0</span></div>
                    <div class="status-area">🦸‍♂️ Aventurile Împăcării</div>
                </div>
                <div class="game-main">
                    <div class="start-screen">
                        <div class="super-title">✨ Super-eroul Autocontrolului ✨</div>
                        <div class="hero-img">🦸‍♀️🤝🦸‍♂️</div>
                        <h2 style="color:#3b2c1f;">Aventurile Împăcării</h2>
                        <p style="font-size:1.2rem;">Învață să alegi reacția de super-erou!</p>
                        <button class="btn-start" id="btnStartMisiunea">🚀 Începe misiunea 🚀</button>
                    </div>
                </div>
            `;
            const startBtn = document.getElementById("btnStartMisiunea");
            if (startBtn) startBtn.addEventListener("click", () => {
                gameActive = true;
                currentIndex = 0;
                score = 0;
                waitingForNext = false;
                // generam prima lista amestecata
                if (currentIndex < SITUATII_ORIGINALE.length) {
                    currentShuffledOptions = getShuffledOptionsForSituation(SITUATII_ORIGINALE[currentIndex]);
                }
                render();
            });
            return;
        }

        // Joc activ - verificam daca am terminat toate situatiile
        if (currentIndex >= SITUATII_ORIGINALE.length) {
            // Final joc cu mesaj
            const finalScore = score;
            let medalMessage = "";
            if (finalScore === SITUATII_ORIGINALE.length * 10) {
                medalMessage = "🏆 PERFECT! Ești un adevărat SUPER-EROU AL PACEI! 🏆";
            } else if (finalScore >= SITUATII_ORIGINALE.length * 5) {
                medalMessage = "🌟 Bine făcut! Autocontrolul te face campion! 🌟";
            } else {
                medalMessage = "🌱 Fiecare pas contează! Continuă să exersezi autocontrolul! 🌱";
            }
            root.innerHTML = `
                <div class="game-header">
                    <div class="score-box">🏅 Punctaj final: <span>${score}</span></div>
                    <div class="status-area">🎉 Misiune îndeplinită!</div>
                </div>
                <div class="game-main">
                    <div class="finish-message">
                        🦸‍♂️✨ Ești Super-eroul Prieteniei! ✨🦸‍♀️<br>
                        ${medalMessage}<br>
                        ⭐ Scor: ${score} / ${SITUATII_ORIGINALE.length*10} ⭐
                    </div>
                    <div class="next-area">
                        <button class="btn-next" id="restartGameBtn">🔄 Joacă din nou</button>
                    </div>
                </div>
            `;
            const restartBtn = document.getElementById("restartGameBtn");
            if (restartBtn) restartBtn.addEventListener("click", () => {
                gameActive = true;
                currentIndex = 0;
                score = 0;
                waitingForNext = false;
                if (currentIndex < SITUATII_ORIGINALE.length) {
                    currentShuffledOptions = getShuffledOptionsForSituation(SITUATII_ORIGINALE[currentIndex]);
                }
                render();
            });
            return;
        }

        // Preluam situatia curenta si optiunile deja amestecate (sau le amestecam daca nu exista)
        const situ = SITUATII_ORIGINALE[currentIndex];
        if (!currentShuffledOptions || currentShuffledOptions.length === 0) {
            currentShuffledOptions = getShuffledOptionsForSituation(situ);
        }

        const feedbackHtml = waitingForNext ? `<div class="mesaj-feedback" id="feedbackMsg">✨ ${localStorage.getItem("lastFeedback") || "Alege răspunsul corect! (apasă Next)"} ✨</div>` : `<div class="mesaj-feedback" id="feedbackMsg"></div>`;

        // Construim butoanele din optiunile amestecate
        let buttonsHtml = '';
        for (let opt of currentShuffledOptions) {
            let emojiPrefix = "";
            if (opt.type === "impulsiv") emojiPrefix = "⚡";
            else if (opt.type === "evitare") emojiPrefix = "🌀";
            else if (opt.type === "supererou") emojiPrefix = "🦸‍♂️";
            buttonsHtml += `<button data-type="${opt.type}" class="reaction-btn">${emojiPrefix} ${opt.text} ${emojiPrefix === "🦸‍♂️" ? "🦸‍♀️" : ""}</button>`;
        }

        root.innerHTML = `
            <div class="game-header">
                <div class="score-box">🏆 Scor: <span>${score}</span></div>
                <div class="status-area">🦸‍♂️ Misiunea ${currentIndex+1} / ${SITUATII_ORIGINALE.length}</div>
            </div>
            <div class="game-main">
                <div class="question-area">
                    <div class="situation-text">${situ.text}</div>
                    <div class="reaction-buttons" id="reactionContainer">
                        ${buttonsHtml}
                    </div>
                    ${feedbackHtml}
                </div>

                <!-- MINI-NIVEL SPECIAL: Provocarea numărătorii până la 10 -->
                <div class="challenge-area">
                    <div class="challenge-title">🧘‍♀️ Provocarea numărătorii până la 10 🧘‍♂️</div>
                    <p>Apasă butonul, respiră și numără pentru a te calma ca un super-erou!</p>
                    <div class="count-box">
                        <div class="count-number" id="countDisplay">🔢</div>
                        <button class="btn-count" id="countBtn">🔁 Numără liniștit până la 10</button>
                    </div>
                    <div id="countFeedback" style="font-style:italic; margin-top:5px;"></div>
                </div>
                
                <div class="next-area">
                    ${waitingForNext ? `<button class="btn-next" id="nextSituationBtn">➡️ Situația următoare ⬅️</button>` : `<button class="btn-next" id="waitNextDisabled" disabled style="opacity:0.6; background:gray;">Alege o reacție mai întâi</button>`}
                </div>
            </div>
        `;

        // atasam event listeners pentru butoanele de reactie (doar daca nu asteapta next)
        if (!waitingForNext) {
            const reactionBtns = document.querySelectorAll('.reaction-btn');
            const feedbackDiv = document.getElementById("feedbackMsg");
            
            const handleAnswer = (alegereType) => {
                if (waitingForNext) return;
                const isCorect = (alegereType === situ.corect); // corect mereu "supererou"
                let mesaj = "";
                if (isCorect) {
                    score += 10;
                    mesaj = "✅ Bravo! Ai folosit autocontrolul! +10 puncte ✅ 🦸‍♂️";
                    localStorage.setItem("lastFeedback", mesaj);
                } else {
                    mesaj = "❌ Încearcă din nou. Amintește-ți: STOP – respiră și numără până la 10. ❌ Folosește reacția de SUPER-EROU data viitoare!";
                    localStorage.setItem("lastFeedback", mesaj);
                }
                if (feedbackDiv) feedbackDiv.innerHTML = mesaj;
                waitingForNext = true;
                // Actualizam scorul in UI prin re-render
                render();
            };
            
            reactionBtns.forEach(btn => {
                const type = btn.getAttribute('data-type');
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleAnswer(type);
                });
            });
        } else {
            const nextBtn = document.getElementById("nextSituationBtn");
            if (nextBtn) {
                nextBtn.addEventListener("click", () => {
                    currentIndex++;
                    waitingForNext = false;
                    // Generam noi optiuni amestecate pentru urmatoarea situatie
                    if (currentIndex < SITUATII_ORIGINALE.length) {
                        currentShuffledOptions = getShuffledOptionsForSituation(SITUATII_ORIGINALE[currentIndex]);
                    } else {
                        currentShuffledOptions = [];
                    }
                    render();
                });
            }
        }

        // evenimente pentru provocarea numărătorii (mini-nivel animat - disponibil oricand)
        const countButton = document.getElementById("countBtn");
        const countDisplaySpan = document.getElementById("countDisplay");
        const countFeed = document.getElementById("countFeedback");
        if (countButton) {
            let counting = false;
            // elimina event vechi prin clonare? Nu e necesar, dar pentru siguranta vom inlocui handler
            const newCountBtn = countButton.cloneNode(true);
            countButton.parentNode.replaceChild(newCountBtn, countButton);
            newCountBtn.addEventListener("click", () => {
                if (counting) return;
                counting = true;
                let step = 1;
                if (countDisplaySpan) countDisplaySpan.innerText = "1️⃣";
                if (countFeed) countFeed.innerText = "🧘 Respiră adânc...";
                const interval = setInterval(() => {
                    if (step <= 10) {
                        let emoji = "";
                        if (step === 1) emoji = "1️⃣";
                        else if (step === 2) emoji = "2️⃣";
                        else if (step === 3) emoji = "3️⃣";
                        else if (step === 4) emoji = "4️⃣";
                        else if (step === 5) emoji = "5️⃣";
                        else if (step === 6) emoji = "6️⃣";
                        else if (step === 7) emoji = "7️⃣";
                        else if (step === 8) emoji = "8️⃣";
                        else if (step === 9) emoji = "9️⃣";
                        else if (step === 10) emoji = "🔟";
                        if (countDisplaySpan) countDisplaySpan.innerText = emoji;
                        if (countFeed) countFeed.innerText = `Numără: ${step} ... inspiră și expiră calm.`;
                        step++;
                    } else {
                        clearInterval(interval);
                        if (countDisplaySpan) countDisplaySpan.innerText = "🧘‍♂️ 10! Ești zen! 🧘‍♀️";
                        if (countFeed) countFeed.innerHTML = "🌟 Super! Ai făcut exercițiul de calm! Acum ești și mai puternic! 🌟";
                        setTimeout(() => {
                            if (countDisplaySpan && !counting) return;
                            if (countDisplaySpan) countDisplaySpan.innerText = "🔢";
                            if (countFeed) countFeed.innerText = "";
                            counting = false;
                        }, 2000);
                        counting = false;
                    }
                }, 450);
            });
        }
    }

    // initializam jocul in modul ecran start
    gameActive = false;
    currentIndex = 0;
    score = 0;
    waitingForNext = false;
    render();
</script>
</body>
</html>
